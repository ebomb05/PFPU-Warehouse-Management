{% extends 'base.html' %}{% block content %}<header><h2>Scan Station</h2><p>Click barcode field, scan item, choose action.</p></header>{% if message %}<div class="notice">{{message}}</div>{% endif %}<section class="panel scan"><form method="post" action="/scan"><label>Barcode / Asset ID</label><input name="barcode_value" autofocus required class="scanbox" placeholder="Scan barcode here"><label>Action</label><select name="action"><option value="return">Return / Check In</option><option value="prep">Move to Prep Area</option><option value="checkout">Check Out to Job</option><option value="move">Move Location</option><option value="repair">Send to Repair</option></select><label>Job</label><select name="job_id"><option value="">No job</option>{% for j in jobs %}<option value="{{j.id}}">{{j.job_number}} - {{j.customer}} {{j.event_name}}</option>{% endfor %}</select><label>Location</label><select name="to_location"><option value="">Auto / unchanged</option>{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select><label>Notes</label><input name="notes"><button class="big">Submit Scan</button></form></section>{% endblock %}
