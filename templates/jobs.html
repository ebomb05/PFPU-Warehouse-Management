{% extends 'base.html' %}{% block content %}<header><h2>Jobs / Orders</h2></header><section class="panel"><h3>Create Job</h3><form method="post" action="/jobs/create" class="rowform"><input name="customer" placeholder="Customer" required><input name="event_name" placeholder="Event / Job name"><input name="out_date" type="date" required><input name="return_date" type="date" required><input name="notes" placeholder="Notes"><button>Create</button></form></section><section class="panel"><table><tr><th>Job</th><th>Customer</th><th>Event</th><th>Out</th><th>Return</th><th>Status</th></tr>{% for r in rows %}<tr><td><a href="/jobs/{{r.id}}">{{r.job_number}}</a></td><td>{{r.customer}}</td><td>{{r.event_name}}</td><td>{{r.out_date}}</td><td>{{r.return_date}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
