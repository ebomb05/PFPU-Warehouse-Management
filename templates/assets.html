{% extends 'base.html' %}{% block content %}<header><h2>Tracked Assets</h2><form><input name="q" placeholder="Search barcode, item, location" value="{{q}}"><button>Search</button></form></header><section class="panel"><h3>Generate New Barcoded Assets</h3><form method="post" action="/assets/generate" class="rowform"><select name="item_master_id">{% for i in items %}<option value="{{i.id}}">{{i.description}} (Qty {{i.qty_total}})</option>{% endfor %}</select><input name="qty" type="number" min="1" max="500" value="1"><select name="location">{% for l in locations %}<option>{{l.name}}</option>{% endfor %}</select><button>Generate Assets + Barcodes</button></form></section><section class="panel"><table><tr><th>Asset ID</th><th>Description</th><th>Status</th><th>Location</th><th>Job</th></tr>{% for r in rows %}<tr><td>{{r.asset_id}}</td><td>{{r.description}}</td><td><span class="pill">{{r.status}}</span></td><td>{{r.current_location}}</td><td>{{r.assigned_job_id or ''}}</td></tr>{% endfor %}</table></section>{% endblock %}
