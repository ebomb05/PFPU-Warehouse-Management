{% extends "base.html" %}

{% block content %}

<header class="login-brand-header">

    <img
        src="/static/branding/pfpu_logo.png"
        alt="Power Factory Productions"
        class="login-brand-logo"
    >

    <div>
        <h2>Warehouse Manager</h2>
        <p>Sign in to access warehouse operations.</p>
    </div>

</header>

{% if message %}
<section class="panel">
    <strong>{{ message }}</strong>
</section>
{% endif %}

<section class="panel">

    <form
        method="post"
        action="/login"
    >

        <label>Username</label>

        <input
            name="username"
            autocomplete="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="big"
        >
            Sign In
        </button>

    </form>

</section>

{% endblock %}
