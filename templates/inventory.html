{% extends 'base.html' %}{% block content %}<header><h2>Inventory Master</h2><form><input name="q" placeholder="Search inventory" value="{{q}}"><button>Search</button></form></header><div class="panel"><table><tr><th>ID</th><th>Category</th><th>Prefix</th><th>Description</th><th>Total Qty</th><th>Tracked</th><th>Priority</th><th>Create Assets</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.category}}</td><td>{{r.prefix}}</td><td>{{r.description}}</td><td>{{r.qty_total}}</td><td>{{r.tracked}}</td><td>{{r.tracking_priority}}</td><td><form method="post" action="/assets/generate" class="inline"><input type="hidden" name="item_master_id" value="{{r.id}}"><input name="qty" type="number" min="1" max="500" value="1"><input name="location" value="Warehouse"><button>Generate</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
